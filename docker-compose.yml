services:
  webapp:
    build: .
    container_name: webtex-webapp
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: 3000
      WEBTEX_SECRET: ${WEBTEX_SECRET:?Imposta WEBTEX_SECRET con un valore casuale sicuro}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: webtex
      DB_PASSWORD: webtex
      DB_NAME: webtex
      DATA_DIR: /app/data/projects
      APP_BASE_URL: http://localhost:3000
      TEX_BIN_PATH: /usr/local/texlive/bin/x86_64-linux
      TEX_PATH_LOCKED: "true"
      LILYPOND_BIN_PATH: /usr/bin
      LILYPOND_PATH_LOCKED: "true"
      COMPILE_TIMEOUT_MS: 30000
      COOKIE_SECURE: "false"
      # OAuth 2.0 / OIDC SSO, ad esempio Authentik.
      # OAUTH_ISSUER_URL: https://auth.example.org/application/o/webtex
      # OAUTH_AUTHORIZATION_URL: https://auth.example.org/application/o/authorize/
      # OAUTH_TOKEN_URL: https://auth.example.org/application/o/token/
      # OAUTH_USERINFO_URL: https://auth.example.org/application/o/userinfo/
      # OAUTH_CLIENT_ID: webtex
      # OAUTH_CLIENT_SECRET: change-this-client-secret
      # OAUTH_REDIRECT_URI: http://localhost:3000/api/auth/sso/callback
      # OAUTH_SCOPE: openid email profile
      # OAUTH_CLIENT_AUTH_METHOD: client_secret_basic
      # OAUTH_AUTO_REGISTER: "false"
      # Argon2id password hashing. Memory cost is in KiB.
      # ARGON2_MEMORY_COST: 65536
      # ARGON2_TIME_COST: 3
      # ARGON2_PARALLELISM: 1
    ports:
      - "3000:3000"
    volumes:
      - project-data:/app/data
      # Monta qui distribuzioni LaTeX e LilyPond compatibili con il container.
      # - ./texlive/bin:/usr/local/texlive/bin/x86_64-linux:ro
      # - ./lilypond/bin/lilypond:/usr/bin/lilypond:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mariadb:
    image: mariadb:11.4.10-noble
    container_name: webtex-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: webtex-root
      MARIADB_DATABASE: webtex
      MARIADB_USER: webtex
      MARIADB_PASSWORD: webtex
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uwebtex", "-pwebtex"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mariadb-data:
  project-data:
