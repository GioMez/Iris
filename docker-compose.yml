services:
  webapp:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      IRIS_SECRET: "${IRIS_SECRET:?Set IRIS_SECRET to a secure random value}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: iris
      # Password for the restricted PostgreSQL user used by the application.
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD to a secure random value}"
      DB_NAME: iris
      DATA_DIR: /app/data
      APP_BASE_URL: http://localhost:3000
      TEX_BIN_PATH: /usr/local/texlive/bin/x86_64-linux
      TEX_PATH_LOCKED: "true"
      LILYPOND_BIN_PATH: /usr/bin
      LILYPOND_PATH_LOCKED: "true"
      COMPILE_TIMEOUT_MS: 30000
      COOKIE_SECURE: "false"
      # Enable only behind a reverse proxy that rewrites X-Forwarded-For.
      TRUST_PROXY: "false"
      # Presence of this file refuses writes for a consistent backup/restore
      # window; reads continue. Remove it to reopen writes.
      MAINTENANCE_FILE: /app/data/.maintenance
      SHUTDOWN_TIMEOUT_MS: "15000"
      # OAuth 2.0 / OIDC SSO, for example Authentik.
      # OAUTH_ISSUER_URL: https://auth.example.org/application/o/iris
      # OAUTH_AUTHORIZATION_URL: https://auth.example.org/application/o/authorize/
      # OAUTH_TOKEN_URL: https://auth.example.org/application/o/token/
      # OAUTH_USERINFO_URL: https://auth.example.org/application/o/userinfo/
      # OAUTH_CLIENT_ID: iris
      # OAUTH_CLIENT_SECRET: change-this-client-secret
      # OAUTH_REDIRECT_URI: http://localhost:3000/api/auth/sso/callback
      # OAUTH_SCOPE: openid email profile
      # OAUTH_CLIENT_AUTH_METHOD: client_secret_basic
      # OAUTH_AUTO_REGISTER: "false"
      # Argon2id password hashing. Memory cost is in KiB.
      # ARGON2_MEMORY_COST: 65536
      # ARGON2_TIME_COST: 3
      # ARGON2_PARALLELISM: 1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - project-data:/app/data
      # Mount container-compatible LaTeX and LilyPond distributions here.
      # - ./texlive/bin:/usr/local/texlive/bin/x86_64-linux:ro
      # - ./lilypond/bin/lilypond:/usr/bin/lilypond:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    # PostgreSQL 18 is the supported database baseline for Iris.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD to a secure random value}"
      # Used only by the initialization script to create the restricted role.
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD to a secure random value}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init/01-create-iris-user.sh:/docker-entrypoint-initdb.d/01-create-iris-user.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  project-data:
